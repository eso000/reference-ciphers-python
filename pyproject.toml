[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptology-python"
version = "0.1.0"
description = "From-scratch, teaching-oriented block cipher implementations with official test vectors"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["cryptography", "aes", "des", "blowfish", "twofish", "serpent", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
# The ciphers are pure standard library; no runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Independent oracles used by examples/verify_vectors.py (pycrypto is the old name,
# pycryptodome is the maintained fork providing the same Crypto.Cipher API).
oracle = ["pycryptodome"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
