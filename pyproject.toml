[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-ciphers-python"
version = "0.1.0"
description = "From-scratch reference implementations of classic block ciphers, verified against official test vectors"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "cryptography",
    "aes",
    "des",
    "blowfish",
    "twofish",
    "serpent",
    "reference-implementation",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
# The ciphers are pure standard library; no runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Independent oracles used by examples/verify_vectors.py (pycrypto is the old name,
# pycryptodome is the maintained fork providing the same Crypto.Cipher API).
oracle = ["pycryptodome"]
# Development tooling: pip install -e ".[dev]"
dev = ["black", "mypy", "pylint", "coverage[toml]"]

[project.scripts]
refciphers = "refciphers.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[tool.coverage.run]
source = ["refciphers"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
