name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (black, mypy, pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: Format (black)
        run: black --check src tests examples
      - name: Types (mypy)
        run: mypy
      - name: Lint (pylint)
        run: pylint src tests examples

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System oracle libraries (libtomcrypt, nettle)
        run: sudo apt-get update && sudo apt-get install -y libtomcrypt-dev libnettle-dev
      - name: Install dev and oracle extras
        run: pip install -e ".[dev,oracle]"
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests
      - name: Vector and oracle verification
        run: python -m examples.verify_vectors
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -t tests
          coverage xml -o coverage.xml
          coverage report -m
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false